name: Bitwise
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # ADD THIS LINE HERE

flutter:
  uses-material-design: true
  assets:
    - assets/icons/logo.png
    - assets/icons/bitewise_app_icon_foreground.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#2E4A34"
  adaptive_icon_foreground: "assets/icons/bitewise_app_icon_foreground.png"