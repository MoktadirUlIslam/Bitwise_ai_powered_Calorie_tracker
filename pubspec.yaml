name: Bitwise
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0

  # ADDED FOR CAMERA & IMAGE HANDLING
  camera: ^0.10.5
  path_provider: ^2.1.1
  path: ^1.9.0

  # ADDED FOR PERMISSIONS (This was missing!)
  permission_handler: ^11.3.1

  #Firbase core
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/logo.png
    - assets/icons/bitewise_app_icon_foreground.png

# Launcher Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#2E4A34"
  adaptive_icon_foreground: "assets/icons/bitewise_app_icon_foreground.png"